####################################################################
# DMZ-SW (S3700) —— 服务器区二层交换机
# 互联：
#   GigabitEthernet0/0/1 -> R1 GE0/0/2        access VLAN40
#   Ethernet0/0/1        -> Cloud 端口2（主机环回 10.20.0.10）
#   Ethernet0/0/2        -> DNS-Server 10.20.0.53
####################################################################
system-view
sysname DMZ-SW

vlan batch 40

interface GigabitEthernet0/0/1
 description TO-R1
 port link-type access
 port default vlan 40
 quit

interface Ethernet0/0/1
 description TO-CLOUD-SERVER
 port link-type access
 port default vlan 40
 quit

interface Ethernet0/0/2
 description TO-DNS-SERVER
 port link-type access
 port default vlan 40
 quit

return

####################################################################
# 验证：
#   display vlan
#   display mac-address
####################################################################
