####################################################################
# CORE (S5700) —— 三层核心：VLAN 网关 / DHCP / OSPF
# 互联：
#   GE0/0/1 -> R1 GE0/0/1       10.0.1.2/24 (VLAN100)
#   GE0/0/2 -> ACC1 GE0/0/1     trunk vlan 10 99
#   GE0/0/3 -> ACC2 GE0/0/1     trunk vlan 20 99
#   GE0/0/4 -> AC6005（选做）    trunk vlan 30
####################################################################
system-view
sysname CORE

#
# 1. VLAN
#
vlan batch 10 20 30 99 100

#
# 2. 物理接口
#
interface GigabitEthernet0/0/1
 description TO-R1
 port link-type access
 port default vlan 100
 quit

interface GigabitEthernet0/0/2
 description TO-ACC1
 port link-type trunk
 port trunk allow-pass vlan 10 99
 quit

interface GigabitEthernet0/0/3
 description TO-ACC2
 port link-type trunk
 port trunk allow-pass vlan 20 99
 quit

interface GigabitEthernet0/0/4
 description TO-AC6005-OPTIONAL
 port link-type trunk
 port trunk allow-pass vlan 30
 quit

#
# 3. VLAN 网关
#
interface Vlanif100
 description UPLINK-TO-R1
 ip address 10.0.1.2 255.255.255.0
 quit

interface Vlanif10
 ip address 192.168.10.1 255.255.255.0
 quit

interface Vlanif20
 ip address 192.168.20.1 255.255.255.0
 quit

interface Vlanif30
 ip address 192.168.30.1 255.255.255.0
 quit

interface Vlanif99
 description MGMT
 ip address 192.168.99.1 255.255.255.0
 quit

#
# 4. DHCP
#
dhcp enable

ip pool vlan10
 network 192.168.10.0 mask 255.255.255.0
 gateway-list 192.168.10.1
 dns-list 10.20.0.53
 quit

ip pool vlan20
 network 192.168.20.0 mask 255.255.255.0
 gateway-list 192.168.20.1
 dns-list 10.20.0.53
 quit

ip pool vlan30
 network 192.168.30.0 mask 255.255.255.0
 gateway-list 192.168.30.1
 dns-list 10.20.0.53
 quit

interface Vlanif10
 dhcp select global
 quit

interface Vlanif20
 dhcp select global
 quit

interface Vlanif30
 dhcp select global
 quit

#
# 5. OSPF：默认路由由 R1 下发
#
ospf 1 router-id 2.2.2.2
 area 0.0.0.0
  network 10.0.1.0 0.0.0.255
  network 192.168.10.0 0.0.0.255
  network 192.168.20.0 0.0.0.255
  network 192.168.30.0 0.0.0.255
  network 192.168.99.0 0.0.0.255
 quit
quit

return

