####################################################################
# CORE (S5700) —— QoS 选做配置
# 说明：
#   1) 语音优先：VLAN30（无线/语音面试）流量标记 DSCP EF，
#      保证拥塞时优先调度。
#   2) 学生限速：VLAN20 入方向限速 4Mbps，用于演示带宽与
#      "简历上传变慢、语音仍流畅"的对比。
# 注意：如果设备不支持在某个接口上应用 traffic-policy，
#       换到另一个物理接口或 Vlanif 上试。
####################################################################
system-view

#
# 1. 语音优先
#
acl number 3001
 rule 5 permit ip source 192.168.30.0 0.0.0.255
 quit

traffic classifier VOICE operator or
 if-match acl 3001
 quit

traffic behavior VOICE
 remark dscp ef
 car cir 2048
 quit

traffic policy QOS_VOICE
 classifier VOICE behavior VOICE
 quit

interface GigabitEthernet0/0/4
 traffic-policy QOS_VOICE inbound
 quit

#
# 2. 学生网段限速
#
acl number 3002
 rule 5 permit ip source 192.168.20.0 0.0.0.255
 quit

traffic classifier LIMIT_STUDENT operator or
 if-match acl 3002
 quit

traffic behavior LIMIT_STUDENT
 car cir 4096
 quit

traffic policy QOS_LIMIT
 classifier LIMIT_STUDENT behavior LIMIT_STUDENT
 quit

interface GigabitEthernet0/0/3
 traffic-policy QOS_LIMIT inbound
 quit

return

####################################################################
# 验证：
#   display traffic policy user-defined
#   display traffic policy statistics interface GigabitEthernet0/0/3 inbound
#   display traffic policy statistics interface GigabitEthernet0/0/4 inbound
#
# 演示：限速前后在 PC-B 上传同一份 20MB 简历，对比耗时。
####################################################################
