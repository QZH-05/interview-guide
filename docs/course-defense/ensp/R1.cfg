####################################################################
# R1 (AR2220) —— 出口路由 / NAT / ACL 安全网关 / 默认路由
# 互联：
#   GE0/0/0 -> ISP-PUB          202.100.1.1/30
#   GE0/0/1 -> CORE GE0/0/1     10.0.1.1/24
#   GE0/0/2 -> DMZ-SW GE0/0/1   10.20.0.1/24
####################################################################
system-view
sysname R1

#
# 1. 接口地址
#
interface GigabitEthernet0/0/0
 description TO-ISP
 ip address 202.100.1.1 255.255.255.252
 quit

interface GigabitEthernet0/0/1
 description TO-CORE
 ip address 10.0.1.1 255.255.255.0
 quit

interface GigabitEthernet0/0/2
 description TO-DMZ
 ip address 10.20.0.1 255.255.255.0
 quit

#
# 2. NAT 地址池匹配（内网 + DMZ 出公网）
#
acl number 2000
 rule 5 permit source 192.168.0.0 0.0.255.255
 rule 10 permit source 10.20.0.0 0.0.0.255
 quit

interface GigabitEthernet0/0/0
 nat outbound 2000
 quit

#
# 3. DMZ 访问控制（包过滤防火墙）
#    策略：学生/办公只能访问 DMZ 的 80/53/ICMP，
#          数据库 5432、Redis 6379、MinIO 9001、应用 8080 一律拒绝。
#    注意：rule 30 必须放行，否则 OSPF 邻居建立不起来。
#
acl number 3000
 rule 5  permit tcp destination 10.20.0.0 0.0.0.255 destination-port eq www
 rule 10 permit udp destination 10.20.0.0 0.0.0.255 destination-port eq domain
 rule 15 permit tcp destination 10.20.0.0 0.0.0.255 destination-port eq domain
 rule 20 permit icmp destination 10.20.0.0 0.0.0.255
 rule 25 deny   ip destination 10.20.0.0 0.0.0.255
 rule 30 permit ip
 quit

interface GigabitEthernet0/0/1
 traffic-filter inbound acl 3000
 quit

# 说明：若当前 AR 版本不支持 traffic-filter，可改用：
#   traffic classifier DENY_DB operator or
#    if-match acl 3000
#   traffic behavior DENY_DB
#    permit
#   traffic policy FILTER_DMZ
#    classifier DENY_DB behavior DENY_DB
#   interface GigabitEthernet0/0/1
#    traffic-policy FILTER_DMZ inbound

#
# 4. 路由：默认路由指向模拟公网 + OSPF 与核心互通
#
ip route-static 0.0.0.0 0.0.0.0 202.100.1.2

ospf 1 router-id 1.1.1.1
 default-route-advertise always
 area 0.0.0.0
  network 10.0.1.0 0.0.0.255
  network 10.20.0.0 0.0.0.255
 quit
quit

#
# 5. DNS 客户端（用于验证内网 DNS）
#
dns resolve
dns server 10.20.0.53

return

####################################################################
# 配置完成后执行：
#   save
#   y
#
# 验证：
#   display ip interface brief
#   display ip routing-table
#   display ospf peer brief
#   display nat session all
#   display acl 3000
#   ping interview.local
####################################################################
